# ============================================================
#  FSMPBank — конфигурация
# ============================================================

# Валюта — АР (алмазная руда): название и значок валюты в интерфейсе.
currency:
  # Короткий символ, который показывается после суммы
  symbol: "АР"
  # Полное название
  name: "алмазная руда"
  # Значок валюты в меню (Bukkit Material).
  material: DIAMOND_ORE

# Настройки счетов и карт
account:
  # Стартовый баланс при открытии счёта
  starting-balance: 0.0
  # Максимальное количество карт у личного счёта
  max-cards: 3
  # Комиссия за перевод (доля, 0.0 = без комиссии, 0.02 = 2%)
  transfer-fee: 0.0
  # Сколько последних операций хранить в истории каждого счёта
  history-size: 30

# Корпоративные счета (ИП)
corporate:
  # Плата за открытие корпоративного счёта (списывается с личного счёта)
  open-cost: 0.0
  # Максимум корпоративных счетов на одного игрока
  max-per-player: 3

# Платёжные таблички
sign:
  # Первая строка-триггер таблички
  header: "[Bank]"

# Сообщения (поддерживают цветовые коды через &)
messages:
  prefix: "&8[&6Банк F-SMP&8] &7"
  no-permission: "&cУ тебя нет прав на это действие."
  players-only: "&cЭто действие доступно только игрокам."
  account-created: "&aСчёт открыт! Номер счёта: &e%number%"
  account-exists: "&eУ тебя уже есть личный счёт: &6%number%"
  no-account: "&cУ тебя ещё нет счёта. Открой его: &e/bank open"
  balance: "&7Баланс счёта &6%number%&7: &a%balance%"
  card-created: "&aВыпущена новая карта: &e%number%"
  card-limit: "&cДостигнут лимит карт (%max%)."
  card-removed: "&aКарта &e%number% &aудалена."
  card-frozen: "&cЭта карта заморожена."
  card-over-limit: "&cПревышен суточный лимит карты."
  not-enough-money: "&cНедостаточно средств на счёте."
  transfer-sent: "&aПеревод &e%amount% &aна счёт &6%target% &aвыполнен."
  transfer-received: "&aПоступление &e%amount% &aот &6%from%&a."
  target-not-found: "&cПолучатель не найден."
  invalid-amount: "&cУкажи корректную сумму больше нуля."
  deposit-done: "&aЗачислено &e%amount% &aна счёт игрока &6%player%&a."
  withdraw-done: "&aСписано &e%amount% &aсо счёта игрока &6%player%&a."
  banker-added: "&aИгрок &6%player% &aназначен банкиром."
  banker-removed: "&aИгрок &6%player% &aбольше не банкир."
  corp-created: "&aКорпоративный счёт &6%name% &aоткрыт! Номер: &e%number%"
  corp-limit: "&cДостигнут лимит корпоративных счетов (%max%)."
  reload-done: "&aКонфигурация перезагружена."
